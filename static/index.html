<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interativo</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ────────────────────────────────────────────── */
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e2e4ea;
      --muted:     #8b8fa3;
      --accent:    #6c8cff;
      --accent-h:  #8aa4ff;
      --success:   #34d399;
      --success-bg:#0d3a2a;
      --danger:    #f87171;
      --danger-bg: #3a1515;
      --radius:    12px;
      --shadow:    0 8px 32px rgba(0,0,0,.35);
    }

    /* ── Base ─────────────────────────────────────────────────────── */
    html { font-size: 16px; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      line-height: 1.6;
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 680px;
    }
    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: .35rem;
    }
    .header p { color: var(--muted); font-size: .9rem; }

    /* ── Progress ─────────────────────────────────────────────────── */
    .progress-bar-wrap {
      width: 100%;
      max-width: 680px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .4s ease;
    }
    .progress-text {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 1rem;
    }

    /* ── Score badge ──────────────────────────────────────────────── */
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .35rem 1rem;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    .score-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 680px;
      padding: 2rem;
      animation: fadeUp .35s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Category chip ────────────────────────────────────────────── */
    .category {
      display: inline-block;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent);
      background: rgba(108,140,255,.12);
      padding: .2rem .7rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    /* ── Question ─────────────────────────────────────────────────── */
    .question-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    /* ── Options ──────────────────────────────────────────────────── */
    .options { display: flex; flex-direction: column; gap: .65rem; }

    .option-btn {
      display: flex;
      align-items: center;
      gap: .85rem;
      width: 100%;
      text-align: left;
      padding: .85rem 1.1rem;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .1s;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(108,140,255,.06);
    }
    .option-btn:active:not(:disabled) { transform: scale(.985); }

    .option-btn .letter {
      flex-shrink: 0;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--border);
      font-weight: 700;
      font-size: .85rem;
      transition: background .2s, color .2s;
    }
    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(108,140,255,.1);
    }
    .option-btn.selected .letter {
      background: var(--accent);
      color: #fff;
    }
    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }
    .option-btn.correct .letter {
      background: var(--success);
      color: #fff;
    }
    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }
    .option-btn.wrong .letter {
      background: var(--danger);
      color: #fff;
    }
    .option-btn:disabled { cursor: default; opacity: .85; }

    /* ── Explanation ──────────────────────────────────────────────── */
    .explanation {
      margin-top: 1.25rem;
      padding: 1rem 1.15rem;
      border-radius: var(--radius);
      font-size: .95rem;
      line-height: 1.65;
      animation: fadeUp .3s ease;
    }
    .explanation.correct-expl {
      background: var(--success-bg);
      border-left: 3px solid var(--success);
    }
    .explanation.wrong-expl {
      background: var(--danger-bg);
      border-left: 3px solid var(--danger);
    }
    .explanation strong { display: block; margin-bottom: .3rem; }

    /* ── Audio indicator ──────────────────────────────────────────── */
    .audio-pulse {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse .6s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: .4; transform: scale(.8); }
      to   { opacity: 1;  transform: scale(1.2); }
    }

    /* ── Results ──────────────────────────────────────────────────── */
    .results { text-align: center; max-width: 420px; width: 100%; }
    .results .big-score {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -.04em;
      margin: .5rem 0;
    }
    .results .big-score span { color: var(--accent); }
    .results .label {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .results .message {
      font-size: 1.05rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    /* ── Question Card ─────────────────────────────────────────────── */
    .question-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--border);
    }
    .question-category {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent);
      background: rgba(108,140,255,.12);
      padding: .2rem .6rem;
      border-radius: 999px;
    }
    .question-number {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 500;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    /* ── Options ───────────────────────────────────────────────────── */
    .options { display: flex; flex-direction: column; gap: .65rem; }
    .option-btn {
      display: flex;
      align-items: center;
      gap: .85rem;
      width: 100%;
      text-align: left;
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .1s, box-shadow .2s;
    }
    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(108,140,255,.08);
      box-shadow: 0 4px 12px rgba(108,140,255,.15);
    }
    .option-btn:active:not(:disabled) { transform: scale(.985); }
    .option-btn .letter {
      flex-shrink: 0;
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--border);
      font-weight: 700;
      font-size: .9rem;
      transition: background .2s, color .2s;
    }
    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(108,140,255,.12);
    }
    .option-btn.selected .letter {
      background: var(--accent);
      color: #fff;
    }
    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }
    .option-btn.correct .letter {
      background: var(--success);
      color: #fff;
    }
    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }
    .option-btn.wrong .letter {
      background: var(--danger);
      color: #fff;
    }
    .option-btn:disabled { cursor: default; opacity: .85; }

    /* ── Keyboard hint ────────────────────────────────────────────── */
    .keyboard-hint {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.7;
      max-width: 680px;
      width: 100%;
    }
    .keyboard-hint kbd {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .1rem .45rem;
      font-size: .72rem;
      font-family: inherit;
      font-weight: 600;
    }

    /* ── KaTeX overrides ──────────────────────────────────────────── */
    .katex-display { margin: .6em 0; }
    .katex { font-size: 1.05em; }

    /* ── Loading ──────────────────────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      color: var(--muted);
      padding: 3rem 0;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

/* ── Toolbar ──────────────────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
  padding: 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: .5rem;
}
.toolbar-group.toolbar-nav {
  flex: 1;
  min-width: 200px;
  justify-content: center;
}
.toolbar-group.toolbar-audio,
.toolbar-group.toolbar-actions {
  flex-shrink: 0;
}
.question-selector select {
  flex: 1;
  min-width: 150px;
  padding: .4rem .6rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: .85rem;
}
.toolbar-group.toolbar-nav .btn {
  padding: .5rem .8rem;
  font-size: .8rem;
}


/* ── Responsive ───────────────────────────────────────────────── */
    @media (max-width: 520px) {
      body { padding: 1rem .6rem; }
      .card { padding: 1.3rem; }
      .question-text { font-size: 1rem; }
      .btn { padding: .55rem .85rem; font-size: .8rem; }

      /* Toolbar mobile adjustments */
      .toolbar {
        flex-direction: column;
        gap: .75rem;
        padding: .75rem;
      }
      .toolbar-group {
        width: 100%;
        justify-content: center;
        gap: .4rem;
      }
      .toolbar-group.toolbar-nav {
        order: 2;
        min-width: 0;
      }
      .toolbar-group.toolbar-audio {
        order: 1;
      }
      .toolbar-group.toolbar-actions {
        order: 3;
      }
      .question-selector {
        width: 100%;
      }
      .question-selector select {
        width: 100%;
        min-width: 0;
        font-size: .9rem;
      }
      .toolbar-group.toolbar-nav .btn {
        padding: .5rem .75rem;
        font-size: .75rem;
      }
      .toolbar-group .btn {
        padding: .5rem .75rem;
        font-size: .8rem;
      }
    }
  </style>
</head>

<body>

  <!-- ═══ Header ═══════════════════════════════════════════════════ -->
  <header class="header">
    <h1>🧠 Quiz Interativo</h1>
    <p>Responda as questões usando o teclado ou o mouse</p>
  </header>

  <!-- ═══ Progress ══════════════════════════════════════════════════ -->
  <div class="progress-bar-wrap" id="progressBarWrap">
    <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText"></div>

  <!-- ═══ Score badge ═══════════════════════════════════════════════ -->
  <div class="score-badge" id="scoreBadge">
    <span class="dot"></span>
    <span id="scoreText">0 corretas</span>
  </div>

  <!-- ═══ Main card ═════════════════════════════════════════════════ -->
  <main class="card" id="mainCard">
    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      Carregando questões…
    </div>
    <div id="quizState" style="display:none"></div>
    <div id="resultsState" class="results" style="display:none"></div>
  </main>

  <!-- ═══ Navigation ═════════════════════════════════════════════════ -->
  <!-- ═══ Toolbar (unified: audio + navigation + actions) ════════ -->
  <div class="toolbar" id="toolbar" style="display:none">
    <!-- Audio group (left) -->
    <div class="toolbar-group toolbar-audio">
      <button class="btn" id="btnSpeak" title="Ouvir a questão (R)">
        🔊 Ouvir <kbd>R</kbd>
      </button>
      <button class="btn" id="btnStop" title="Parar áudio">
        ⏹ Parar
      </button>
    </div>

    <!-- Navigation group (center) -->
    <div class="toolbar-group toolbar-nav">
      <button class="btn" id="btnPrev" title="Questão anterior (←)" disabled>
        ← Ant
      </button>
      <div class="question-selector">
        <select id="questionSelect" title="Escolher questão"></select>
      </div>
      <button class="btn" id="btnNextNav" title="Próxima questão (→)">
        Próx →
      </button>
    </div>

    <!-- Action group (right) -->
    <div class="toolbar-group toolbar-actions">
      <button class="btn btn-primary" id="btnConfirm" title="Confirmar resposta (Enter)" disabled>
        ✔ Confirmar <kbd>Enter</kbd>
      </button>
      <button class="btn btn-success" id="btnNext" title="Próxima questão (Enter)" style="display:none">
        ➜ Próxima <kbd>Enter</kbd>
      </button>
    </div>
  </div>

  <!-- ═══ Keyboard hints ══════════════════════════════════ -->
  <div class="keyboard-hint" id="keyboardHint" style="display:none">
    <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> selecionar &nbsp;·&nbsp;
    <kbd>R</kbd> / <kbd>Espaço</kbd> ouvir &nbsp;·&nbsp;
    <kbd>← →</kbd> navegar &nbsp;·&nbsp;
    <kbd>Enter</kbd> confirmar / próxima
  </div>

  <!-- ═══ Hidden audio ═══════════════════════════════════════════════ -->
  <!-- ═══ Hidden audio ══════════════════════════════════════════════ -->
  <audio id="audioPlayer"></audio>
  <script type="module" src="/static/js/quiz-app.js"></script>

</body>
</html>
